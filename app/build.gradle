apply plugin: 'com.android.application'

android {
    compileSdk 37
    ndkVersion "28.0.12433510"

    defaultConfig {
        applicationId "io.hefuyi.listener"
        minSdk 24
        targetSdk 37
        versionCode 7
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh", "en"
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            versionNameSuffix "_debug"
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        aidl = true
        viewBinding = true
        dataBinding = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    namespace "io.hefuyi.listener"
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    ]
    options.compilerArgs << "-Xlint:deprecation"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'androidx.annotation', module: 'annotation'
    })
    implementation 'androidx.appcompat:appcompat:1.8.0'
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'

    //rxjava3
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    //glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    //gson — used directly (ArtistDetailPresenter, SearchAdapter, ArtistAdapter).
    // Declared explicitly so it never relies on transitive luck.
    implementation 'com.google.code.gson:gson:2.14.0'
    //materialicon
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'

    //dagger2
    implementation 'com.google.dagger:dagger:2.60.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    //slidinguppanel
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    //app theme engine
    implementation('com.github.naman14:app-theme-engine:0.5.2@aar') {
        transitive = true
    }
}

