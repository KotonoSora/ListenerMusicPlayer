apply plugin: 'com.android.application'

android {
    compileSdk 37
    ndkVersion "28.0.12433510"

    defaultConfig {
        applicationId "io.hefuyi.listener"
        minSdk 30
        targetSdk 37
        versionCode 7
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "zh", "en"
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            versionNameSuffix "_debug"
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        aidl = true
        viewBinding = true
        dataBinding = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    namespace "io.hefuyi.listener"
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += [
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    ]
    options.compilerArgs << "-Xlint:deprecation"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1', {
        exclude group: 'androidx.annotation', module: 'annotation'
    })
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'

    //rxjava
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'io.reactivex:rxjava:1.3.8'
    //glide
    implementation 'com.github.bumptech.glide:glide:3.8.0'
    //retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    //materialicon
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'

    //dagger2
    implementation 'com.google.dagger:dagger:2.60.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    //materialdialogs
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    //slidinguppanel
    implementation 'com.sothree.slidinguppanel:library:3.3.1'
    //app theme engine
    implementation('com.github.naman14:app-theme-engine:0.5.2@aar') {
        transitive = true
    }
    //media
    implementation 'androidx.media:media:1.7.0'
}
