# Project-wide Gradle settings.

# --- Gradle & JVM Performance ---
# Increase heap size and optimize GC for faster builds.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel task execution.
org.gradle.parallel=true

# Enable the Gradle build cache.
org.gradle.caching=true

# Enable configuration caching to skip the configuration phase on subsequent builds.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- AndroidX & Compatibility ---
# Use AndroidX libraries.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,MULTIDEX_NOT_NEEDED

# --- Build Features & Behavior ---
# Improve incrementality by ensuring R classes only contain a module's own resources.
android.nonTransitiveRClass=false
android.nonConstantRClass=false

# Enforce unique package names across all modules.
android.uniquePackageNames=true

# Use R8 in full mode for more aggressive optimization.
android.enableR8.fullMode=true

# Use the new DSL interfaces (suggested for AGP 9.0+).
android.newDsl=true

# Ensure native libraries are uncompressed and 16KB aligned
android.bundle.enableUncompressedNativeLibs=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
