apply plugin: 'com.android.library'

android {
    namespace "io.hefuyi.listener"
    compileSdk 37
    defaultConfig {
        minSdk 24
    }
    buildFeatures {
        aidl = true
        dataBinding = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.github.code-mc:material-icon-lib:1.1.5'
    implementation 'com.google.dagger:dagger:2.60.1'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.60.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation('com.github.naman14:app-theme-engine:0.5.2@aar') {
        transitive = true
    }
}
